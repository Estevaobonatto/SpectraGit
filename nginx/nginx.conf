# SpectraGit reverse proxy
# Terminates HTTP on port 80 and routes traffic to the api and frontend services.
# For HTTPS/TLS, place a certificate-terminating proxy (Caddy, Traefik, certbot+nginx)
# in front of this container and forward to port 80.

upstream api {
    server api:3000;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ── WebSocket (Socket.IO) ─────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── Git HTTP smart protocol ───────────────────────────────────────────────
    # Matches /<owner>/<repo>.git and /<owner>/<repo>.git/info/refs etc.
    location ~ ^/[^/]+/[^/]+\.git(/.*)?$ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Needed for git push/pull large pack objects
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    # ── React SPA (everything else) ───────────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
    }
}
