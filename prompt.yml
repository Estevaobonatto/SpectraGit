Vamos fazer melhorias na visualização e design da parte de pull requests e issues. A ideia é deixar a interface mais limpa, moderna e fácil de usar, seguindo as tendências atuais de design. Aqui estão algumas sugestões de melhorias:

1. **Layout Limpo e Organizado**: Adote um layout mais espaçado, com seções claramente definidas para cada pull request e issue. Use cartões ou blocos para destacar cada item, com informações essenciais como título, autor, status e data de criação.

2. **Código**: Mostre os arquivos e código alterado de forma resumida com botão para mostrar tudo, suporte a comentários.

3. **Status Visual**: Use cores e ícones para indicar o status de cada pull request e issue (aberto, fechado, em revisão, etc.). Isso ajuda os usuários a identificar rapidamente o estado de cada item.

4. **Filtros e Ordenação**: Adicione opções de filtro e ordenação para que os usuários possam facilmente encontrar pull requests e issues específicos com base em critérios como data, autor, status, etc.

5. **Ações Rápidas**: Inclua botões de ação rápida para cada pull request e issue, como "Merge", "Close", "Comment", etc., para facilitar a interação dos usuários.

6. **Onboarding**: Interface clara em etapas para cada fase de criação, edição, aceitação e fechamento de pull requests e issues, com mensagens de feedback claras para cada ação.

Altere o backend e frontend para implementar essas melhorias, garantindo que a experiência do usuário seja aprimorada e que a interface seja mais intuitiva e agradável de usar. Mantenha o estilo de design e siga o SDD do app